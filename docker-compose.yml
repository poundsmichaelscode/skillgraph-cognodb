name: skillgraph

services:
  api:
    image: skillgraph-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/v1/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  web:
    image: skillgraph-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
